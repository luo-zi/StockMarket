name: Build NeoForge 1.21.1

on:
  push:
    branches:
      - main
      - "mc_1.21.1"
    paths-ignore:
      - "**.md"
      - "documentation/**"
      - "changelog/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - main
      - "mc_1.21.1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Loom 需要为 Minecraft 反编译/重映射预留足够堆内存，2G 在 CI 上容易 OOM
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3G -Dorg.gradle.daemon=false"

jobs:
  build-neoforge:
    name: Build NeoForge jar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 只有主分支写缓存，PR 只读，避免污染缓存
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Read mod version
        id: mod
        run: |
          VERSION=$(grep -E '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Mod version: ${VERSION}"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build NeoForge module
        run: ./gradlew :neoforge:build --stacktrace --no-daemon

      - name: Verify artifacts
        run: |
          echo "=== neoforge/build/libs ==="
          ls -lh neoforge/build/libs || true

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: stockmarket-neoforge-${{ steps.mod.outputs.version }}
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-dev*.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Write summary
        if: always()
        run: |
          {
            echo "### NeoForge 1.21.1 build"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Mod version: \`${{ steps.mod.outputs.version }}\`"
            echo "- Gradle: \`$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-//; s/-bin.zip//')\`"
            echo ""
            echo "Artifact \`stockmarket-neoforge-${{ steps.mod.outputs.version }}\` contains the remapped production jar from \`neoforge/build/libs\` (dev-shadow / sources excluded)."
          } >> "$GITHUB_STEP_SUMMARY"
